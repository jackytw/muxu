<!-- Common Head Optimization -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1120">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon.png">

<!-- DNS Prefetch & Preconnect for Fast Loading -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
<link rel="dns-prefetch" href="https://www.googletagmanager.com">

<!-- Jekyll SEO Tag (Title, Meta Description, Canonical, OG, Twitter) -->
{% seo %}

<!-- Schema.org Organization Structured Data -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "沐旭科技有限公司",
    "alternateName": "Muxu Technology Co., Ltd.",
    "url": "{{ site.url }}",
    "email": "{{ site.email }}",
    "telephone": "+886-2-6609-3166",
    "description": "{{ site.description }}",
    "logo": "{{ site.url }}/favicon.png",
    "sameAs": [
        "https://lin.ee/pWGID3I"
    ]
}
</script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    muxu: {
                        dark: '#0b1120',
                        primary: '#0f172a',
                        secondary: '#1e293b',
                        accent: '#38bdf8', // Sky 400
                        highlight: '#0ea5e9', // Sky 500
                        text: '#f8fafc',
                        muted: '#94a3b8'
                    }
                },
                fontFamily: {
                    sans: ['Noto Sans TC', 'Inter', 'sans-serif'],
                }
            }
        }
    }
</script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-111JWF4BJ9"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-111JWF4BJ9');
</script>
